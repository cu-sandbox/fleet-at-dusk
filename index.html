<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101f23">
  <title>Fleet at Dusk</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main>
    <header class="masthead">
      <div class="eyebrow">A SOLO NAVAL STRATEGY GAME</div>
      <h1>Fleet at Dusk</h1>
      <p>Find and sink the opposing fleet before it sinks yours.</p>
    </header>
    <section class="command" aria-label="Game controls">
      <div>
        <div id="phase" class="eyebrow"></div>
        <p id="status" role="status" aria-atomic="true"></p>
      </div>
      <div class="actions">
        <button id="rotate" type="button">Rotate: horizontal</button>
        <button id="shuffle" type="button">Randomize fleet</button>
        <button id="reset" type="button">New game</button>
        <button id="start" class="primary" type="button">Start battle</button>
      </div>
    </section>
    <div class="boards">
      <section class="panel" aria-labelledby="own-title">
        <header><h2 id="own-title">Your waters</h2><span id="own-count"></span></header>
        <div id="own-board" class="board" role="group" aria-labelledby="own-title"></div>
      </section>
      <section class="panel" aria-labelledby="enemy-title">
        <header><h2 id="enemy-title">Hostile waters</h2><span id="enemy-count"></span></header>
        <div id="enemy-board" class="board" role="group" aria-labelledby="enemy-title"></div>
      </section>
    </div>
    <footer class="legend" aria-label="Map legend">
      <span><i class="ship"></i>Ship</span>
      <span><i class="miss"></i>Miss</span>
      <span><i class="hit"></i>Hit</span>
      <span><i class="sunk"></i>Sunk</span>
    </footer>
  </main>
</body>
</html>
